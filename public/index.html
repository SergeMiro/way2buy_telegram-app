<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#14122b" />
  <title>Way2Buy · Клуб</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314122b'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23e8c477' font-family='sans-serif' font-weight='700'%3EW%3C/text%3E%3C/svg%3E" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/views.css" />
</head>
<body>
  <!-- Demo profile switcher (hidden inside real Telegram) -->
  <div id="demobar" class="demobar" hidden>
    <span class="demobar__dot"></span>
    <span class="demobar__label">DEMO</span>
    <select id="demoUser" class="demobar__select" aria-label="Демо-профіль"></select>
  </div>

  <main id="app" class="app"><div class="loader">Завантаження…</div></main>

  <!-- Bottom navigation -->
  <nav id="nav" class="nav" hidden>
    <button class="nav__btn" data-tab="catalog">
      <svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span>Каталоги</span>
    </button>
    <button class="nav__btn" data-tab="feed">
      <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>
      <span>Канал</span>
    </button>
    <!-- Примірочна: the badge is the only counter a client has to understand -->
    <button class="nav__btn nav__btn--cart" data-tab="cart">
      <svg viewBox="0 0 24 24"><path d="M5 7h14l-1.2 12H6.2z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg>
      <span>Примірочна</span>
      <span class="nav__badge" id="cartBadge" hidden>0</span>
    </button>
    <button class="nav__btn" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M12 4l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4L7.5 17.8l.9-5L4.8 9.3l5-.7z"/></svg>
      <span>Знижки</span>
    </button>
    <button class="nav__btn nav__btn--admin" data-tab="admin" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg>
      <span>Кабінет</span>
    </button>
  </nav>

  <!-- Sheet host -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" id="sheetPanel"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/js/telegram.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
