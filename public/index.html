<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#f7f3f1" />
  <title>Way2Buy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2311100f'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23ffffff' font-family='Georgia,serif'%3EW%3C/text%3E%3C/svg%3E" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/views.css" />
</head>
<body>
  <main id="app" class="app"><div class="loader">Завантаження…</div></main>

  <!-- Bottom navigation. One line weight, one 24-grid, and five glyphs taken
       from the shop rather than from an icon set: paper bag, paper plane,
       hanger, per cent, briefcase. Each is explained where it is drawn. -->
  <nav id="nav" class="nav" hidden>
    <button class="nav__btn" data-tab="catalog">
      <!-- The boutique paper bag. It was the wrong icon while «Примірочна» was
           also a bag; with the fitting room now a hanger the strongest retail
           symbol there is comes free. -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5.5 8h13l-1 11.6a1 1 0 0 1-1 .9H7.5a1 1 0 0 1-1-.9z"/>
        <path d="M9.3 8V6.4a2.7 2.7 0 0 1 5.4 0V8"/>
      </svg>
      <span>Каталоги</span>
    </button>
    <button class="nav__btn" data-tab="feed">
      <!-- Telegram's own paper plane: the tab IS the Telegram channel, and no
           drawing explains that faster than the symbol the app itself uses. -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 3.5 10.4 13.6"/>
        <path d="M20.5 3.5 14.2 20.5l-3.8-6.9-6.9-3.8z"/>
      </svg>
      <span>Стрічка</span>
    </button>
    <!-- Примірочна: the badge is the only counter a client has to understand -->
    <button class="nav__btn nav__btn--cart" data-tab="cart">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <!-- The hook is the only thing that separates a hanger from a triangle,
             so it gets a wider arc than the shape would otherwise need: at 20px
             a 1.2px stroke has very little room to say "hanger". -->
        <path d="M12 10.2V8.4a2.3 2.3 0 1 1 2.3-2.3"/>
        <path d="M12 10.2 4.3 16.1a1 1 0 0 0 .6 1.8h14.2a1 1 0 0 0 .6-1.8z"/>
      </svg>
      <span>Примірочна</span>
      <span class="nav__badge" id="cartBadge" hidden>0</span>
    </button>
    <button class="nav__btn" data-tab="home">
      <!-- A percent, not a tag. The tab is «Знижки», and a per-cent sign is the
           one symbol every client already reads as "cheaper" without learning
           anything — a tag only says "there is a price". -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.5 5.5 5.5 18.5"/>
        <circle cx="7.8" cy="7.8" r="2.8"/><circle cx="16.2" cy="16.2" r="2.8"/>
      </svg>
      <span>Знижки</span>
    </button>
    <button class="nav__btn nav__btn--admin" data-tab="admin" hidden>
      <!-- A briefcase: «Кабінет» is an office, and this is the office. Sliders
           described the contents; this describes the room, which is what the
           label says. -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.8" y="7.8" width="18.4" height="12" rx="1.6"/>
        <path d="M8.8 7.8V6.4A1.6 1.6 0 0 1 10.4 4.8h3.2a1.6 1.6 0 0 1 1.6 1.6v1.4"/>
        <path d="M2.8 12.6h18.4"/>
      </svg>
      <span>Кабінет</span>
    </button>
  </nav>

  <!-- Sheet host -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" id="sheetPanel"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/js/telegram.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
